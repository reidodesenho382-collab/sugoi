<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugoi TCG – Leilão de cartas Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--paper:#EEF1F6;--card:#fff;--line:#D5DBE6;--hot:#E63946;--gold:#F0B232;--mute:#5B6784;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#EAF0FF;--paper:#0F1626;--card:#18213A;--line:#2B3856;--mute:#9AA7C7;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.signup{display:grid;gap:14px}
.link{background:none;color:var(--mute);padding:0;font-weight:500;text-decoration:underline;justify-self:start}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;margin:4px 0 8px}
.stepper input{text-align:center;font-weight:700;font-size:1.1rem}
.stepper button{padding:8px;font-size:1.2rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:6px 12px;font-size:.9rem}
@media(max-width:520px){.two,.three{grid-template-columns:1fr}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,4vw,40px);border-bottom:3px solid var(--gold);position:sticky;top:0;background:#000;z-index:5}
.logo-img{height:48px;width:auto;display:block;border-radius:6px}
header .ghost{color:#fff;border-color:#555}
header .meta{color:#cfcfcf}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}.logo b{color:var(--hot)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--ink);color:var(--paper)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.hot{background:var(--hot);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 80px}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.05;letter-spacing:-.03em;max-width:14ch}
.tabs{display:flex;gap:6px}.tabs button{background:transparent;color:var(--mute);border:1px solid var(--line)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;color:inherit;font-weight:400;display:flex;flex-direction:column;gap:10px}
.tile:hover{border-color:var(--ink)}
.frame{aspect-ratio:63/88;border-radius:8px;background:linear-gradient(135deg,var(--gold),#ff7b54 40%,#6c5ce7 75%,#00b8d9);padding:5px;position:relative;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block;background:var(--line)}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-100%);transition:transform .7s}
.tile:hover .frame::after{transform:translateX(100%)}
.tile h3{font-size:1.05rem;font-weight:700;line-height:1.2}
.meta{color:var(--mute);font-size:.88rem}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price{font:800 1.3rem "Bricolage Grotesque",sans-serif}
.time{font-weight:700;font-variant-numeric:tabular-nums}.time.soon{color:var(--hot)}
.empty{grid-column:1/-1;padding:48px 0;color:var(--mute);text-align:center}
dialog{border:0;border-radius:16px;padding:0;background:var(--card);color:var(--ink);width:min(760px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,15,30,.6)}
.pad{padding:22px;display:grid;gap:14px}
.detail{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:22px}
@media(max-width:620px){.detail{grid-template-columns:1fr}.frame{max-width:260px;margin:auto;width:100%}}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
input,select{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bids{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.92rem;max-height:160px;overflow:auto}
.bids li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px}
.err{color:var(--hot);font-weight:700;min-height:1.4em;margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;font-weight:700;z-index:20}
.badge{display:inline-block;background:var(--gold);color:#14213D;border-radius:6px;padding:2px 8px;font-weight:700;font-size:.8rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    </div>
    <div class="signup" hidden>
      <label>Nome completo<input name="fullName" autocomplete="name" maxlength="100" placeholder="Ash Ketchum"></label>
    </div>
    <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
    <label>Senha<input name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"></label>
    <div class="signup" hidden>
      <div class="two">
        <label>Telefone (com DDD)<input name="phone" id="phone" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678"></label>
        <label>CPF<input name="cpf" id="cpf" inputmode="numeric" placeholder="000.000.000-00"></label>
      </div>
      <div class="two">
        <label>CEP<input name="cep" id="cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000"></label>
        <label>Rua<input name="street" autocomplete="address-line1" maxlength="100"></label>
      </div>
      <div class="two">
        <label>Número<input name="number" maxlength="10"></label>
        <label>Complemento (opcional)<input name="complement" maxlength="60" data-opt></label>
      </div>
      <div class="three">
        <label>Bairro<input name="district" maxlength="60"></label>
        <label>Cidade<input name="city" maxlength="60"></label>
        <label>Estado (UF)<input name="state" maxlength="2" pattern="[A-Za-z]{2}" placeholder="SP"></label>
      </div>
    </div>
    <p class="err" id="authErr" role="alert"></p>
    <button type="submit" id="authSubmit" class="hot">Entrar</button>
    <button type="button" class="link" id="forgot">Esqueci minha senha</button>
  </form>
</dialog>

<dialog id="newDlg">
  <form class="pad" id="newForm" method="dialog">
    <h2>Criar leilão</h2>
    <label>Nome da carta<input name="name" required maxlength="80" placeholder="Charizard ex 199/165"></label>
    <div class="two">
      <label>Coleção<input name="set" required maxlength="60" placeholder="Pokémon 151"></label>
      <label>Condição
        <select name="cond"><option value="M">M – Mint</option><option value="NM" selected>NM – Near Mint</option><option value="SP">SP – Slightly Played</option><option value="MP">MP – Moderately Played</option><option value="HP">HP – Heavily Played</option><option value="D">D – Damaged</option></select>
      </label>
    </div>
    <div class="two">
      <label>Lance inicial (R$)<input name="start" type="number" min="1" step="0.01" required></label>
      <label>Incremento mínimo (R$)<input name="step" type="number" min="1" step="0.01" value="5" required></label>
    </div>
    <div class="two">
      <label>Preço de mercado (R$, referência)<input name="market" type="number" min="0" step="0.01"></label>
    </div>
    <div class="two">
      <label>Duração
        <select name="hours"><option value="1">1 hora</option><option value="6">6 horas</option><option value="24" selected>24 horas</option><option value="72">3 dias</option><option value="168">7 dias</option></select>
      </label>
      <label>Foto da carta<input name="img" type="file" accept="image/*" required></label>
    </div>
    <p class="err" id="newErr"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="ghost" id="newCancel">Cancelar</button>
      <button type="submit" id="newSubmit" class="hot">Publicar leilão</button>
    </div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, sendEmailVerification, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, getDoc, deleteDoc, onSnapshot, query, orderBy, limit, runTransaction, increment, writeBatch, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBkmhX5nMcjVl1Z_zgIaNk24Y8rct0ZrgY",
  authDomain: "sugoi-leilao.firebaseapp.com",
  projectId: "sugoi-leilao",
  storageBucket: "sugoi-leilao.firebasestorage.app",
  messagingSenderId: "1022986285172",
  appId: "1:1022986285172:web:f42dba6491ac4c77816121",
  measurementId: "G-QP7QB3GR4Q"
});
try { getAnalytics(app); } catch (e) {}
const auth = getAuth(app), db = getFirestore(app);

// Sem Firebase Storage (plano gratuito): a foto é reduzida e guardada no próprio documento do leilão.
async function compress(file) {
  const bmp = await createImageBitmap(file);
  const r = Math.min(1, 520 / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  for (const q of [0.75, 0.6, 0.45, 0.3]) {
    const url = c.toDataURL("image/jpeg", q);
    if (url.length < 300000) return url;
  }
  throw new Error("Imagem muito grande. Tente outra foto.");
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtTime = ms => {
  if (ms <= 0) return "Encerrado";
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return d ? `${d}d ${h}h ${m}min` : h ? `${h}h ${m}min ${x}s` : `${m}min ${x}s`;
};
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 3200); }

let user = null, auctions = [], filter = "live", openId = null, unsubDetail = [];

/* ---------- Auth ---------- */
let isAdmin = false;
onAuthStateChanged(auth, async u => {
  user = u;
  isAdmin = false;
  if (u) { try { isAdmin = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {} }
  $("#who").textContent = u ? (u.displayName || u.email) + (isAdmin ? " (admin)" : "") : "";
  $("#authBtn").textContent = u ? "Sair" : "Entrar";
  $("#signBtn").hidden = !!u;
  $("#newBtn").hidden = !isAdmin;
  if (openId) renderDetail();
});
$("#authBtn").onclick = () => user ? signOut(auth) : openAuth("login");
$("#signBtn").onclick = () => openAuth("signup");

const authDlg = $("#authDlg");
let mode = "login";
const dig = s => s.replace(/\D/g, "");
function setMode(m) {
  mode = m;
  authDlg.querySelectorAll(".atab").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === m));
  authDlg.querySelectorAll(".signup").forEach(el => {
    el.hidden = m !== "signup";
    el.querySelectorAll("input").forEach(i => i.required = m === "signup" && !("opt" in i.dataset));
  });
  $("[name=password]").autocomplete = m === "signup" ? "new-password" : "current-password";
  $("#authSubmit").textContent = m === "signup" ? "Criar conta" : "Entrar";
  $("#forgot").hidden = m !== "login";
}
function openAuth(m) { setMode(m); $("#authErr").textContent = ""; if (!authDlg.open) authDlg.showModal(); }
authDlg.querySelectorAll(".atab").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("#authClose").onclick = () => authDlg.close();

// máscaras
const mask = (el, fn) => el.addEventListener("input", () => el.value = fn(dig(el.value)));
mask($("#cpf"), d => d.slice(0, 11).replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2"));
mask($("#phone"), d => d.slice(0, 11).replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{4,5})(\d{4})$/, "$1-$2"));
mask($("#cep"), d => d.slice(0, 8).replace(/(\d{5})(\d)/, "$1-$2"));

function cpfOk(c) {
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for (let t = 9; t < 11; t++) {
    let s = 0;
    for (let i = 0; i < t; i++) s += c[i] * (t + 1 - i);
    if ((s * 10) % 11 % 10 != c[t]) return false;
  }
  return true;
}

const AUTH_MSG = {
  "auth/email-already-in-use": "Este e-mail já tem uma conta. Use a aba Entrar.",
  "auth/invalid-email": "E-mail inválido.",
  "auth/weak-password": "Senha fraca. Use ao menos 8 caracteres.",
  "auth/invalid-credential": "E-mail ou senha incorretos.",
  "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo."
};
const authMsg = x => AUTH_MSG[x.code] || x.message || "Não foi possível autenticar.";

async function signup(f) {
  const cpf = dig(f.cpf), phone = dig(f.phone);
  if (f.fullName.trim().split(/\s+/).length < 2) throw new Error("Informe nome e sobrenome.");
  if (!cpfOk(cpf)) throw new Error("CPF inválido.");
  if (phone.length < 10) throw new Error("Telefone inválido. Informe DDD e número.");
  if (dig(f.cep).length !== 8) throw new Error("CEP inválido.");
  const email = f.email.trim(), fullName = f.fullName.trim();
  const cred = await createUserWithEmailAndPassword(auth, email, f.password);
  try {
    const b = writeBatch(db);
    b.set(doc(db, "cpfs", cpf), { uid: cred.user.uid }); // garante um CPF por conta
    b.set(doc(db, "users", cred.user.uid), {
      fullName, email, phone, cpf,
      address: { cep: dig(f.cep), street: f.street.trim(), number: f.number.trim(), complement: f.complement.trim(),
                 district: f.district.trim(), city: f.city.trim(), state: f.state.trim().toUpperCase() },
      createdAt: serverTimestamp()
    });
    await b.commit();
  } catch (x) {
    await cred.user.delete().catch(() => {});
    throw new Error(x.code === "permission-denied" ? "Este CPF já está cadastrado." : "Não foi possível salvar o cadastro. Tente de novo.");
  }
  await updateProfile(cred.user, { displayName: fullName });
  $("#who").textContent = fullName;
  sendEmailVerification(cred.user).catch(() => {});
  toast("Conta criada! Enviamos um e-mail de verificação.");
}

$("#authForm").onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), err = $("#authErr"), btn = $("#authSubmit");
  err.textContent = ""; btn.disabled = true;
  try {
    if (mode === "login") await signInWithEmailAndPassword(auth, f.email.trim(), f.password);
    else await signup(f);
    e.target.reset(); authDlg.close();
  } catch (x) { err.textContent = authMsg(x); }
  btn.disabled = false;
};
$("#forgot").onclick = async () => {
  const email = $("[name=email]").value.trim(), err = $("#authErr");
  if (!email) { err.textContent = "Digite seu e-mail acima para receber o link."; return; }
  try { await sendPasswordResetEmail(auth, email); err.textContent = ""; toast("Link de redefinição enviado."); }
  catch (x) { err.textContent = authMsg(x); }
};

/* ---------- Lista em tempo real ---------- */
onSnapshot(query(collection(db, "auctions"), orderBy("endsAt", "asc")),
  snap => { auctions = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderGrid(); },
  e => { $("#grid").innerHTML = `<p class="empty">Erro ao carregar leilões (${esc(e.code)}). Verifique as regras do Firestore.</p>`; });

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderGrid();
});

const endMs = a => a.endsAt?.toMillis?.() ?? 0;
const price = a => a.bidCount ? a.currentBid : a.startPrice;

function renderGrid() {
  const now = Date.now();
  let list = auctions.filter(a => filter === "live" ? endMs(a) > now : endMs(a) <= now);
  if (filter === "done") list = list.reverse();
  $("#grid").innerHTML = list.length ? list.map(a => `
    <button class="tile" data-id="${a.id}">
      <div class="frame"><img src="${esc(a.imageUrl)}" alt="${esc(a.name)}" loading="lazy"></div>
      <h3>${esc(a.name)}</h3>
      <div class="meta">${esc(a.set)} · ${esc(a.cond)}</div>
      <div class="row"><span class="price">${brl(price(a))}</span><span class="meta">${a.bidCount || 0} lances</span></div>
      <div class="time" data-end="${endMs(a)}"></div>
    </button>`).join("")
    : `<p class="empty">${filter === "live" ? "Nenhum leilão ativo no momento. Volte em breve." : "Nenhum leilão encerrado ainda."}</p>`;
  $("#grid").querySelectorAll(".tile").forEach(t => t.onclick = () => openDetail(t.dataset.id));
  tick();
}

function tick() {
  const now = Date.now();
  document.querySelectorAll("[data-end]").forEach(el => {
    const left = +el.dataset.end - now;
    el.textContent = fmtTime(left);
    el.classList.toggle("soon", left > 0 && left < 600000);
  });
}
setInterval(() => {
  tick();
  if (filter === "live" && auctions.some(a => endMs(a) <= Date.now() && endMs(a) > Date.now() - 1500)) renderGrid();
  if (openId) syncBidButton();
}, 1000);

/* ---------- Detalhe e lances ---------- */
let bids = [], draft = null;
function openDetail(id) {
  openId = id; bids = []; draft = null;
  unsubDetail.forEach(u => u());
  unsubDetail = [
    onSnapshot(query(collection(db, "auctions", id, "bids"), orderBy("amount", "desc"), limit(10)), s => { bids = s.docs.map(d => d.data()); renderDetail(); }),
  ];
  renderDetail();
  if (!$("#dlg").open) $("#dlg").showModal();
}
$("#dlg").addEventListener("close", () => { unsubDetail.forEach(u => u()); unsubDetail = []; openId = null; });

function renderDetail() {
  const a = auctions.find(x => x.id === openId);
  if (!a) return;
  const min = a.bidCount ? a.currentBid + a.step : a.startPrice;
  const mine = user && a.sellerId === user.uid;
  $("#dlgBody").innerHTML = `
    <div class="detail">
      <div class="frame"><img src="${esc(a.imageUrl)}" alt="${esc(a.name)}"></div>
      <div style="display:grid;gap:12px;align-content:start">
        <div class="row"><h2>${esc(a.name)}</h2><button class="ghost" id="closeBtn" aria-label="Fechar">✕</button></div>
        <div class="meta">${esc(a.set)} · ${esc(a.cond)}</div>
        ${a.marketPrice ? `<div class="meta">Preço de mercado: ${brl(a.marketPrice)}</div>` : ""}
        <div><span class="meta">${a.bidCount ? "Lance atual" : "Lance inicial"}</span><div class="price" style="font-size:2rem">${brl(price(a))}</div>
          ${a.highBidderName ? `<div class="meta">Maior lance: ${esc(a.highBidderName)}</div>` : ""}</div>
        <div class="time" data-end="${endMs(a)}" id="clock"></div>
        <div id="bidArea">
          ${mine ? `<span class="badge">Seu leilão</span>` : `
          <label for="bidInput">Seu lance (mínimo ${brl(min)})</label>
          <div class="stepper">
            <button type="button" class="ghost" id="bMinus" aria-label="Diminuir lance" ${user ? "" : "disabled"}>−</button>
            <input id="bidInput" type="number" step="0.01" min="${min}" value="${Math.max(min, draft ?? min).toFixed(2)}" ${user ? "" : "disabled"}>
            <button type="button" class="ghost" id="bPlus" aria-label="Aumentar lance" ${user ? "" : "disabled"}>+</button>
          </div>
          <div class="chips">${[2, 5, 10].map(n => `<button type="button" class="ghost chip" data-add="${n * a.step}" ${user ? "" : "disabled"}>+${brl(n * a.step)}</button>`).join("")}</div>
          <button id="bidBtn" class="hot" style="margin-top:8px;width:100%">${user ? "Dar lance" : "Entre para dar lance"}</button>`}
          <p class="err" id="bidErr"></p>
        </div>
        <h3>Últimos lances</h3>
        <ul class="bids">${bids.length ? bids.map(b => `<li><span>${esc(b.name)}</span><b>${brl(b.amount)}</b></li>`).join("") : `<li class="meta">Nenhum lance ainda. Seja o primeiro.</li>`}</ul>
        ${isAdmin ? `<button class="ghost" id="delBtn">Excluir leilão</button>` : ""}
      </div>
    </div>`;
  const inp = $("#bidInput");
  if (inp) {
    const cur = () => parseFloat(inp.value) || min;
    const set = v => { draft = Math.round(Math.max(min, v) * 100) / 100; inp.value = draft.toFixed(2); };
    inp.oninput = () => { draft = parseFloat(inp.value) || null; };
    $("#bMinus").onclick = () => set(cur() - a.step);
    $("#bPlus").onclick = () => set(cur() + a.step);
    document.querySelectorAll(".chip").forEach(c => c.onclick = () => set(cur() + Number(c.dataset.add)));
  }
  $("#closeBtn").onclick = () => $("#dlg").close();
  if ($("#delBtn")) $("#delBtn").onclick = async () => {
    if (!confirm("Excluir este leilão? Essa ação não pode ser desfeita.")) return;
    try { await deleteDoc(doc(db, "auctions", a.id)); $("#dlg").close(); toast("Leilão excluído."); }
    catch (e) { toast("Não foi possível excluir: " + (e.code || e.message)); }
  };
  if ($("#bidBtn")) $("#bidBtn").onclick = () => user ? placeBid(a.id) : (document.querySelector("#dlg").close(), openAuth("login"));
  tick(); syncBidButton();
}
function syncBidButton() {
  const a = auctions.find(x => x.id === openId);
  if (a && $("#bidBtn")) $("#bidBtn").disabled = endMs(a) <= Date.now();
}

async function placeBid(id) {
  const amount = Math.round(parseFloat($("#bidInput").value) * 100) / 100;
  const err = $("#bidErr"); err.textContent = ""; $("#bidBtn").disabled = true;
  try {
    await runTransaction(db, async tx => {
      const r = doc(db, "auctions", id), s = await tx.get(r);
      if (!s.exists()) throw new Error("Leilão não encontrado.");
      const a = s.data(), now = Date.now(), end = a.endsAt.toMillis();
      if (now >= end) throw new Error("Este leilão já encerrou.");
      if (a.sellerId === user.uid) throw new Error("Você não pode dar lance no seu próprio leilão.");
      if (a.highBidderId === user.uid) throw new Error("Você já tem o maior lance.");
      const min = a.bidCount ? a.currentBid + a.step : a.startPrice;
      if (!(amount >= min)) throw new Error("Lance mínimo: " + brl(min));
      const upd = { currentBid: amount, bidCount: increment(1), highBidderId: user.uid, highBidderName: user.displayName || "Anônimo" };
      if (end - now < 120000) upd.endsAt = Timestamp.fromMillis(now + 120000); // anti-sniping: +2 min
      tx.update(r, upd);
      tx.set(doc(collection(r, "bids")), { uid: user.uid, name: user.displayName || "Anônimo", amount, at: serverTimestamp() });
    });
    draft = null;
    toast("Lance registrado!");
  } catch (e) { err.textContent = e.message || "Não foi possível registrar o lance."; }
  syncBidButton();
}

/* ---------- Criar leilão ---------- */
$("#newBtn").onclick = () => { $("#newErr").textContent = ""; $("#newDlg").showModal(); };
$("#newCancel").onclick = () => $("#newDlg").close();
$("#newForm").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target), file = f.get("img"), err = $("#newErr"), btn = $("#newSubmit");
  if (!user || !isAdmin) return;
  if (file.size > 5 * 1024 * 1024) { err.textContent = "A imagem passa de 5 MB."; return; }
  btn.disabled = true; btn.textContent = "Publicando…"; err.textContent = "";
  try {
    const imageUrl = await compress(file);
    const start = parseFloat(f.get("start")), step = parseFloat(f.get("step"));
    await addDoc(collection(db, "auctions"), {
      name: f.get("name").trim(), set: f.get("set").trim(), cond: f.get("cond"),
      startPrice: start, step, marketPrice: parseFloat(f.get("market")) || 0, currentBid: start, bidCount: 0, highBidderId: null, highBidderName: null,
      sellerId: user.uid, sellerName: user.displayName || "Anônimo", imageUrl,
      endsAt: Timestamp.fromMillis(Date.now() + Number(f.get("hours")) * 3600000),
      createdAt: serverTimestamp()
    });
    e.target.reset(); $("#newDlg").close(); toast("Leilão publicado!");
  } catch (x) { err.textContent = "Erro ao publicar: " + (x.code || x.message); }
  btn.disabled = false; btn.textContent = "Publicar leilão";
};
</script>
</body>
</html>
